name = "the-desk-tracker"
compatibility_date = "2024-09-25"
pages_build_output_dir = "."

# After creating your D1 database with:
#   wrangler d1 create desk-db
# paste the database_id it gives you below, then run:
#   wrangler d1 execute desk-db --file=./schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "desk-db"
database_id = "PASTE_YOUR_D1_DATABASE_ID_HERE"
