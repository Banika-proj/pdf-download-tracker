<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Desk — PDF Download Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="gate" style="display:none;"></div>

<button id="rail-toggle" onclick="document.getElementById('rail').classList.toggle('open')">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>

<div id="app-root" style="display:contents;">
  <aside id="rail">
    <div class="rail-brand">
      <div class="mark">🗞️</div>
      <h1>The Desk</h1>
      <p>PDF download tracker</p>
    </div>
    <div class="conn-wrap conn-off" id="conn-badge"><span class="conn-dot"></span>Connecting…</div>
    <nav class="rail-nav" id="rail-nav"></nav>
    <div id="who-chip-wrap" style="display:none;padding:0 1.25rem 0.75rem;">
      <div class="who-chip" id="who-chip" onclick="switchUser()"></div>
    </div>
    <div class="rail-foot">
      <div class="lbl">Today's progress</div>
      <div class="num" id="foot-progress">0 / 0</div>
      <div class="rail-track"><div class="rail-bar" id="foot-bar"></div></div>
    </div>
  </aside>

  <main><div id="page"></div></main>
</div>
<div id="modal-root"></div>

<script src="app.js"></script>
</body>
</html>
